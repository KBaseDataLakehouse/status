<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Token subset lifted from kbase/next-gen-ui (design-system/tokens/tokens.css). */
:root {
  --f-sans: 'Oxygen', system-ui, sans-serif;

  --c-bg: #f5f2ee;
  --c-surface: #ffffff;
  --c-border: rgba(62, 56, 50, 0.09);
  --c-border2: rgba(62, 56, 50, 0.16);
  --c-ink: #1a1714;
  --c-ink2: #3e3832;
  --c-ink3: #6a6158;
  --c-ink4: #776d64;

  --ct-primary: #006eac;
  --ct-green: #3c6e08;
  --ct-yellow: #8c5200;
  --ct-red: #ce1d27;

  --bg-primary: #e1ebf3;
  --bg-green: #e5ece2;
  --bg-yellow: #eeead2;
  --bg-red: #f3e6e4;
  --bo-primary: #cae0f2;
  --bo-green: #d3e2cb;
  --bo-yellow: #ecdda4;
  --bo-red: #f3d4d0;

  --s-2: 6px; --s-3: 8px; --s-4: 10px; --s-5: 12px; --s-6: 14px;
  --s-7: 18px; --s-9: 26px; --s-10: 34px; --s-11: 38px; --s-12: 50px;

  --fs-3: 12px; --fs-4: 13px; --fs-5: 14px; --fs-7: 16px; --fs-9: 18px;
  --fs-hero: clamp(24px, 3.5vw, 30px);

  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: var(--fs-9); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font-family: var(--f-sans);
  color: var(--c-ink);
  background: var(--c-bg);
  line-height: 1.6;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 46rem; margin: 0 auto; padding: var(--s-10) var(--s-7) var(--s-12); }
h1 { font-size: var(--fs-hero); line-height: 1.25; text-wrap: balance; margin-bottom: var(--s-9); }

/* Green-yellow-red means service health and nothing else. No .banner--unknown
   rule: the base style is already the neutral one. */
.banner {
  display: flex;
  align-items: center;
  gap: var(--s-5);
  padding: var(--s-5) var(--s-6);
  border: 1px solid var(--c-border2);
  border-radius: var(--r-md);
  background: var(--c-surface);
  color: var(--c-ink3);
  font-size: var(--fs-7);
  font-weight: 700;
}
.banner--ok { background: var(--bg-green); border-color: var(--bo-green); color: var(--ct-green); }
.banner--degraded { background: var(--bg-yellow); border-color: var(--bo-yellow); color: var(--ct-yellow); }
.banner--down { background: var(--bg-red); border-color: var(--bo-red); color: var(--ct-red); }
.banner__body { display: flex; flex-direction: column; }
.banner__note { font-size: var(--fs-4); font-weight: 400; color: var(--c-ink4); }
.dot { width: 10px; height: 10px; border-radius: 999px; background: currentColor; flex: none; }

.incidents { list-style: none; margin-top: var(--s-5); display: flex; flex-direction: column; gap: var(--s-5); }
#incidents-open { margin-top: var(--s-9); }
.resolved { margin-top: var(--s-7); }
.resolved > summary {
  cursor: pointer;
  color: var(--c-ink4);
  font-size: var(--fs-4);
  padding: var(--s-2) 0;
}
.resolved > summary:hover { color: var(--c-ink2); }
.incident {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: var(--s-7);
}
.incident--resolved { background: transparent; }
.incident--resolved .message { color: var(--c-ink3); }

/* Neutral by default; each modifier owns its colour. */
.chip {
  display: inline-flex;
  align-items: center;
  font-size: var(--fs-3);
  font-weight: 700;
  padding: 1px var(--s-3);
  border-radius: var(--r-sm);
  border: 1px solid var(--c-border2);
  white-space: nowrap;
  background: transparent;
  color: var(--c-ink4);
}

/* Lifecycle: blue, deliberately outside the health scale so a notice never
   reads as an outage. */
.chip--current { background: var(--bg-primary); border-color: var(--bo-primary); color: var(--ct-primary); }
.chip--scheduled { border-color: var(--bo-primary); color: var(--ct-primary); }
.chip--resolved { border-color: var(--c-border2); color: var(--c-ink4); }

.services__title { font-size: var(--fs-7); font-weight: 700; margin: var(--s-11) 0 var(--s-5); }
.services { list-style: none; background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-lg); }
.service {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s-5);
  padding: var(--s-5) var(--s-7);
  font-size: var(--fs-5);
}
.service + .service { border-top: 1px solid var(--c-border); }
.chip--service-ok { background: var(--bg-green); border-color: var(--bo-green); color: var(--ct-green); }
.chip--service-degraded { background: var(--bg-yellow); border-color: var(--bo-yellow); color: var(--ct-yellow); }
.chip--service-down { background: var(--bg-red); border-color: var(--bo-red); color: var(--ct-red); }
.chip--service-unknown { background: transparent; border-color: var(--c-border2); color: var(--c-ink4); }
#services-checked { margin-top: var(--s-3); }

.message { margin: var(--s-4) 0 var(--s-2); color: var(--c-ink2); font-size: var(--fs-5); }
.window { color: var(--c-ink4); font-size: var(--fs-4); }
.footer {
  margin-top: var(--s-11);
  padding-top: var(--s-5);
  border-top: 1px solid var(--c-border);
  color: var(--c-ink4);
  font-size: var(--fs-4);
}
a { color: var(--ct-primary); }
</style>
</head>
<body>
<main>
<h1>{{ site.title }}</h1>
{{ content }}
</main>
</body>
</html>
