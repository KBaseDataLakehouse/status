# KBase Lakehouse platform announcements — the single source of truth for this site.
#
# Editing this file is the whole publishing workflow. On commit, GitHub Pages
# rebuilds and updates two things from it:
#
#   index.md     the human-readable page at the site root
#   status.json  the machine-readable feed KBase Lakehouse JupyterLab polls
#
# This is a full history, newest first. Nothing needs deleting when an
# announcement is over — set `ends_at` and it stops being shown in JupyterLab
# while remaining on the page as a record.
#
# ---------------------------------------------------------------------------
# QUOTE YOUR TIMESTAMPS.
#
# Unquoted YAML timestamps are parsed as date objects and re-serialized into
# status.json in a non-ISO form (no "T", no "Z") that consumers cannot read:
#
#   ends_at: 2026-08-02T13:00:00Z     # WRONG -> re-serialized as a date
#   ends_at: "2026-08-02T13:00:00Z"   # RIGHT -> "2026-08-02T13:00:00Z"
#
# ---------------------------------------------------------------------------
# Fields:
#
#   id         required. Stable, unique, never reused. Dismissal in JupyterLab
#              is remembered per id, so editing an entry's text without
#              changing its id will NOT re-notify anyone who already dismissed
#              it. To re-notify, use a new id.
#   message    required. Plain text, shown verbatim in the popup.
#   starts_at  optional, quoted ISO 8601. Absent means "already started", so an
#              announcement can be committed ahead of time and appear on its
#              own schedule.
#   ends_at    optional, quoted ISO 8601. Absent means "no expiry" — it shows
#              until you give it an end time. Exclusive: at ends_at exactly,
#              the announcement is over.

announcements: []

# Copy this shape when adding one, newest at the top of the list:
#
# announcements:
#   - id: 2026-08-02-spark-restart
#     message: >-
#       Spark clusters restart Saturday 09:00–13:00 PT. Save your work;
#       running jobs will be interrupted.
#     starts_at: "2026-08-02T09:00:00Z"
#     ends_at: "2026-08-02T13:00:00Z"
