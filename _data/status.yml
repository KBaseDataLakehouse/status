# KBase Lakehouse announcements — the only file you edit. On commit, GitHub
# Pages rebuilds index.html (human page) and status.json (feed JupyterLab polls).
#
# Full history, newest first. Nothing needs deleting: set `ends_at` and an entry
# stops showing in JupyterLab while staying on the page as a record.
#
# QUOTE YOUR TIMESTAMPS. Unquoted, YAML parses them as dates and re-serializes
# into status.json without the T/Z, which consumers cannot read:
#
#   ends_at: 2026-08-02T13:00:00Z     # WRONG
#   ends_at: "2026-08-02T13:00:00Z"   # RIGHT
#
# Fields:
#   id         required. Stable, never reused — dismissal is remembered per id,
#              so editing text without changing the id will not re-notify.
#   message    required. Plain text, shown verbatim.
#   starts_at  optional, quoted ISO 8601. Absent = already started.
#   ends_at    optional, quoted ISO 8601. Absent = no expiry. Exclusive.

# Live per-service state, probed in-cluster by JupyterHub. Published here so
# status.json is self-describing: a consumer reads one document and learns
# where the rest lives. Blank drops the service list from the page.
services_url: "https://hub.berdl.kbase.us/hub/status"

announcements: []

# Copy this shape, newest at the top:
#
# announcements:
#   - id: 2026-08-02-spark-restart
#     message: >-
#       Spark clusters restart Saturday 09:00–13:00 PT. Save your work;
#       running jobs will be interrupted.
#     starts_at: "2026-08-02T09:00:00Z"
#     ends_at: "2026-08-02T13:00:00Z"
