# KBase Lakehouse platform announcements — the single source of truth for this site.
#
# Editing this file is the whole publishing workflow. On commit, GitHub Pages
# rebuilds and updates two things from it:
#
#   index.html   the human-readable page at the site root
#   status.json  the machine-readable feed KBase Lakehouse JupyterLab polls
#
# This is a full history, newest first. Nothing needs deleting when an
# announcement is over — set `ends_at` and it stops being shown in JupyterLab
# while remaining on the page as a record.
#
# ---------------------------------------------------------------------------
# QUOTE YOUR TIMESTAMPS.
#
# Unquoted YAML timestamps are parsed as date objects and re-serialized into
# status.json in a non-ISO form (no "T", no "Z") that consumers cannot read:
#
#   ends_at: 2026-08-02T13:00:00Z     # WRONG -> re-serialized as a date
#   ends_at: "2026-08-02T13:00:00Z"   # RIGHT -> "2026-08-02T13:00:00Z"
#
# ---------------------------------------------------------------------------
# Fields:
#
#   id         required. Stable, unique, never reused. Dismissal in JupyterLab
#              is remembered per id, so editing an entry's text without
#              changing its id will NOT re-notify anyone who already dismissed
#              it. To re-notify, use a new id.
#   message    required. Plain text, shown verbatim in the popup.
#   starts_at  optional, quoted ISO 8601. Absent means "already started", so an
#              announcement can be committed ahead of time and appear on its
#              own schedule.
#   ends_at    optional, quoted ISO 8601. Absent means "no expiry" — it shows
#              until you give it an end time. Exclusive: at ends_at exactly,
#              the announcement is over.

# =========================================================================
# MOCK DATA — every entry below is fabricated, for design review only.
# None of these incidents happened. Replace this whole list with `[]`
# before the page is linked or announced anywhere.
# =========================================================================

announcements:
  - id: 2026-08-02-polaris-catalog-migration
    message: >-
      Scheduled maintenance: Polaris catalog migration. Iceberg table metadata
      will be read-only for the duration; Spark and Trino queries continue to
      work but table creation and schema changes will fail.
    starts_at: "2026-08-02T09:00:00Z"
    ends_at: "2026-08-02T13:00:00Z"

  - id: 2026-07-30-spark-connect-restart
    message: >-
      Spark Connect servers are being restarted to pick up new catalog
      configuration. Sessions will drop once and reconnect automatically;
      unsaved notebook state is unaffected.
    starts_at: "2026-07-30T19:00:00Z"
    ends_at: "2026-07-30T23:00:00Z"

  - id: 2026-07-24-trino-degraded
    message: >-
      Resolved: the Trino coordinator was rejecting queries under load for
      about two hours. Spark queries were unaffected. Coordinator memory
      limits have been raised.
    starts_at: "2026-07-24T14:10:00Z"
    ends_at: "2026-07-24T16:25:00Z"

  - id: 2026-07-18-s3-elevated-errors
    message: >-
      Resolved: elevated S3 error rates caused intermittent read failures in
      notebooks and CTS jobs. Caused by a failed storage node; the node has
      been replaced.
    starts_at: "2026-07-18T03:40:00Z"
    ends_at: "2026-07-18T07:15:00Z"

  - id: 2026-07-09-jupyterhub-spawn-failures
    message: >-
      Resolved: notebook servers failed to start for roughly 45 minutes after
      a node pool scale-down. Affected users needed to retry once.
    starts_at: "2026-07-09T17:05:00Z"
    ends_at: "2026-07-09T17:50:00Z"

  - id: 2026-06-27-cts-nersc-backlog
    message: >-
      Resolved: CDM Task Service jobs bound for NERSC Perlmutter queued for
      several hours during a scheduled Perlmutter outage. No jobs were lost.
    starts_at: "2026-06-27T08:00:00Z"
    ends_at: "2026-06-27T18:30:00Z"

  - id: 2026-06-15-hive-metastore-maintenance
    message: >-
      Completed: Hive Metastore database maintenance. Delta table metadata was
      briefly unavailable; Iceberg tables served from Polaris were unaffected.
    starts_at: "2026-06-15T06:00:00Z"
    ends_at: "2026-06-15T08:00:00Z"

  - id: 2026-05-30-platform-upgrade
    message: >-
      Completed: platform upgrade to Spark 4.0.1 and Delta 4.0.0. Notebook
      images were rebuilt; custom pip installs in home directories needed
      reinstalling.
    starts_at: "2026-05-30T16:00:00Z"
    ends_at: "2026-05-31T02:00:00Z"
